name: ecop
services:
  project-init:
    image: python:3.12-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
    user: "0:0"
    restart: "no"
    entrypoint: [/bin/sh, -ec]
    command: ["mkdir -p /projects/exports && chmod 700 /projects /projects/exports && chown -R 10001:10001 /projects"]
    volumes: [projects:/projects]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${ECOP_HOST_PORT:-18765}:8000"
    environment:
      HOME: /tmp
      ECOP_PUBLIC_ORIGIN: "${ECOP_PUBLIC_ORIGIN:?Set HTTPS public origin}"
      ECOP_USER: "${ECOP_USER:-ecop}"
      ECOP_PASSWORD_FILE: /run/secrets/ecop_password
      DWSIM_MCP_URL: http://dwsim:5901/mcp
      DWSIM_TOKEN_FILE: /run/secrets/mcp_token
      DWSIM_MODEL_DIR: /models
      DWSIM_BUILD_REFERENCE: "image:10.2.8@sha256:015fd7ecbf219192d6b9d81a9080ba02fd0de7d4b9388506c4ab755159032f36"
      ECOP_RUNS_DIR: /data/runs
      ECOP_PROJECTS_DIR: /projects
    secrets: [ecop_password, mcp_token]
    volumes:
      - runs:/data
      - projects:/projects
    networks: [edge, engine]
    depends_on:
      project-init: {condition: service_completed_successfully}
      dwsim: {condition: service_started}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  dwsim:
    image: ghcr.io/danwbr/dwsim-mcp:10.2.8@sha256:015fd7ecbf219192d6b9d81a9080ba02fd0de7d4b9388506c4ab755159032f36
    platform: linux/amd64
    restart: unless-stopped
    init: true
    user: "10001:10001"
    environment:
      HOME: /tmp
    # Official executable path and flags verified against upstream Dockerfile/Program.cs.
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        token="$$(cat /run/secrets/mcp_token)"
        test -n "$$token" || { echo "MCP token is empty" >&2; exit 1; }
        exec /opt/dwsim-mcp/dwsim-mcp --http --host 0.0.0.0 --port 5901 --token "$$token"
    secrets: [mcp_token]
    volumes:
      - ./models:/models:ro
      - projects:/projects
    depends_on:
      project-init: {condition: service_completed_successfully}
    networks: [engine]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 4g
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  edge:
  engine:
    internal: true
volumes:
  runs:
  projects:
secrets:
  ecop_password:
    file: ./secrets/ecop_password.txt
  mcp_token:
    file: ./secrets/mcp_token.txt
